{% extends "layout/base.html" %}

{% block content %}
<div class="mx-auto max-w-md py-16 text-center">
  <p class="font-mono text-3xl font-bold text-brand-500">{{ status_code }}</p>
  <h2 class="mt-3 text-lg font-semibold text-ink">{{ error_title }}</h2>
  <p class="mt-2 text-sm leading-relaxed text-ink-secondary">{{ error_body }}</p>
  <a href="/app/dashboard" class="btn-primary mt-6">{{ t("errors.back_to_dashboard") }}</a>
</div>
{% endblock %}
